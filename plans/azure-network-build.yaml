apiVersion: cloudresources.appvia.io/v2beta2
kind: CloudResourcePlan
metadata:
  name: azure-network-build
spec:
  scope:
    allStages: true
    allWorkspaces: true
  cloud: azure
  description: blank
  inputs:
  - description: blank
    name: cloud_resource
    type: string
  - description: blank
    name: cidr_node
    type: string
  - description: blank
    name: resource_group
    type: string
  - description: blank
    name: location
    type: string
  terraform:
    moduleURL: https://github.com/appvia/terraform-azurerm-wayfinder-provisioning//network/build
    moduleVersion: var.variable
    tfVarsTemplate: |
      prevent_destroy = true
      cloud_resource = "{{ .Inputs.cloud_resource }}"
      cidr_node = var.cloud_resource
      resource_group = "{{ .Inputs.resource_group }}"
      location = "{{ .Inputs.location }}"
  version: 0.0.1
  permission: NetworkManager