apiVersion: cloudresources.appvia.io/v2beta2
kind: CloudResourcePlan
metadata:
  name: azure-network-reference
spec:
  scope:
    allStages: true
    allWorkspaces: true
  cloud: azure
  description: blank
  inputs:
  - description: blank
    name: resource_group
    type: string
  - description: blank
    name: virtual_network
    type: string
  - description: blank
    name: subnet_name
    type: string
  terraform:
    moduleURL: https://github.com/appvia/terraform-azurerm-wayfinder-provisioning//network/reference
    moduleVersion: tag5
    tfVarsTemplate: |
      resource_group = "{{ .Inputs.resource_group }}"
      virtual_network = "{{ .Inputs.virtual_network }}"
      subnet_name = "{{ .Inputs.subnet_name }}"
  version: 0.0.1
  permission: NetworkManager