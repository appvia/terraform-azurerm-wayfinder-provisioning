apiVersion: cloudresources.appvia.io/v2beta2
kind: CloudResourcePlan
metadata:
  name: azure-cluster-reference
spec:
  scope:
    allStages: true
    allWorkspaces: true
  cloud: azure
  description: blank
  inputs:
  - description: blank
    name: resource_group
    type: string
  - description: blank
    name: cluster_name
    type: string
  terraform:
    moduleURL: https://github.com/appvia/terraform-azurerm-wayfinder-provisioning//cluster/reference
    moduleVersion: tag10
    tfVarsTemplate: |
      resource_group = "{{ .Inputs.resource_group }}"
      cluster_name = "{{ .Inputs.cluster_name }}"
  version: 0.0.1
  permission: ClusterManager