apiVersion: cloudresources.appvia.io/v2beta2
kind: CloudResourcePlan
metadata:
  name: azure-network-import
spec:
  scope:
    allStages: true
    allWorkspaces: true
  cloud: azure
  description: blank
  inputs:
  - description: blank
    name: cloud_resource
    type: string
  - description: blank
    name: cidr_node
    type: string
  - description: blank
    name: resource_group
    type: string
  - description: blank
    name: virtual_network
    type: string
  - description: blank
    name: location
    type: string
  - description: blank
    name: layout_mode
    type: string
  - description: blank
    name: layout_private_subnets
    type: number
  terraform:
    moduleURL: https://github.com/appvia/terraform-azurerm-wayfinder-provisioning//network/import
    moduleVersion: tag4
    tfVarsTemplate: |
      cloud_resource = "{{ .Inputs.cloud_resource }}"
      existing_network = "{{ .Inputs.virtual_network }}"
      cidr_node = "{{ .Inputs.cidr_node }}"
      resource_group = "{{ .Inputs.resource_group }}"
  version: 0.0.1
  permission: NetworkManager